<h1 class="font-headline-lg text-headline-lg text-on-surface text-center">Welcome Back, Voyager</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center px-md">Step back into the cockpit of your next stellar journey.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault()">
<div class="flex flex-col gap-xs">

<div class="input-glow flex items-center bg-white/5 border border-white/10 rounded-xl px-sm transition-all duration-300">

<input class="bg-transparent border-none focus:ring-0 text-on-surface w-full py-md font-body-md placeholder:text-white/20" placeholder="voyager@aetherair.galactic" type="email"/>
</div>
</div>

</div>
<div class="input-glow flex items-center bg-white/5 border border-white/10 rounded-xl px-sm transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant">lock</span>

</div>
</div>
<button class="btn-amber-glow w-full py-md bg-tertiary text-on-tertiary font-headline-md rounded-xl transition-all duration-300 transform active:scale-95 relative overflow-hidden group">
<span class="relative z-10">Initiate Sign In</span>

<div class="fixed -bottom-32 -left-32 w-96 h-96 bg-primary/20 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed -top-32 -right-32 w-96 h-96 bg-tertiary/10 blur-[120px] rounded-full pointer-events-none"></div>
<script>
        // Micro-interactions for input fields
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.02]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.02]');
            });
        });

        // Toggle Password Visibility
        const togglePass = document.querySelector('button .material-symbols-outlined:contains("visibility")');
        if (togglePass) {
            togglePass.parentElement.addEventListener('click', () => {
                const input = togglePass.parentElement.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    togglePass.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    togglePass.textContent = 'visibility';
                }
            });
        }

        // Search for element with specific text since :contains is not standard
        document.querySelectorAll('.material-symbols-outlined').forEach(icon => {
            if (icon.innerText === 'visibility') {
                icon.parentElement.addEventListener('click', () => {
                    const input = icon.parentElement.previousElementSibling;
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.innerText = 'visibility_off';
                    } else {
                        input.type = 'password';
                        icon.innerText = 'visibility';
                    }
                });
            }
        });
    </script>
</body></html>
