<style>
        body {
            background-color: #111415;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.3);
        }
        .liquid-sweep {
            position: relative;
            overflow: hidden;
        }
        .liquid-sweep::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                transparent,
                rgba(255, 255, 255, 0.05),
                transparent
            );
            transform: rotate(30deg);
            transition: all 0.8s ease;
        }
        .liquid-sweep:hover::after {
            left: 150%;
        }
        .glow-hover:hover {
            box-shadow: 0 0 25px rgba(251, 188, 0, 0.4);
        }
        .custom-checkbox:checked {
            background-color: #fbbc00;
            border-color: #fbbc00;
        }

<body class="antialiased text-on-surface">

</nav>
<div class="flex items-center gap-xs">

</div>
</div>
</header>
<main class="min-h-screen flex flex-col md:flex-row pt-[64px]">
<!-- Left Side: Visual Narrative -->
<div class="w-full md:w-1/2 relative min-h-[409px] md:min-h-0 flex items-center justify-center overflow-hidden bg-black">
<!-- Atmospheric Gradient Background -->

<!-- Spaceship Window Frame Effect -->

<!-- Hero Image: Nebula through window -->
<div class="w-full h-full scale-110" data-alt="A breathtaking view from a high-fidelity spaceship porthole overlooking a vast, vibrant violet and turquoise nebula in deep space. The window frame is sleek and metallic with subtle carbon fiber textures, reflecting the distant starlight. Swirling celestial gases and distant glowing star clusters fill the cosmic horizon, creating a sense of profound wonder and high-end futuristic travel. The lighting is ethereal and cinematic, with soft atmospheric glows that align with a premium interstellar aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBzcVV4pAKpoVs4W0bPPeLfMR2lqm4P0i50bs2Oy6xgIVC1rebtdOPzWygOB59vrGv2_Lsh5albdoZrEjGr84kI5QqOjlnxJsnKznFrVgb5iXz1bwOXfSz5QaUXk1dckXY3-WHUyLZWgh-5CYOfqm-zxN-5nyHHDgogGVNTvOeRe26aM7iv57ayVIycPB3Td9TZgoWWxAMk-92sRI_QsFomz0MQpto2pG8ZVZGCuaHgwNPYr5Bohk8SKzej7gwLUFYJiI4PtxOXuIm8')">

<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
</div>
<div>
<p class="font-label-md text-label-md text-secondary">Active Mission</p>
<p class="font-headline-md text-headline-md text-on-surface">Andromeda-9 Cluster</p>
</div>
</div>
</div>

<p class="font-body-lg text-body-lg text-on-surface-variant">Step into the cockpit of the next generation. Secure your place among the stars.</p>

</div>
</div>

</div>
</div>

<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer" for="terms">

                        Create Account

<p class="font-label-md text-label-md text-on-surface-variant">

</div>

</main>
<script>
        // Simple micro-interaction for password visibility or field focus effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Add a subtle parallax effect to the hero image on mouse move
        const leftSide = document.querySelector('.w-full.md\\:w-1\\/2.relative');
        const heroImg = leftSide.querySelector('div[style*="background-image"]');
        
        leftSide.addEventListener('mousemove', (e) => {
            const { width, height } = leftSide.getBoundingClientRect();
            const x = (e.clientX / width - 0.5) * 20;
            const y = (e.clientY / height - 0.5) * 20;
            heroImg.style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
        });
    </script>
</body></html>
